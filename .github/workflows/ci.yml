name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: fire-code-copilot

jobs:
  backend:
    name: Backend tests + eval
    runs-on: ubuntu-latest
    env:
      # Keep CI fast and offline-friendly: a small local embedder, no reranker, no cloud keys.
      # (Matches the gitignored dev .env; the real default is BGE-M3 which is multi-GB.)
      EMBEDDING_PROVIDER: local
      LOCAL_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      USE_RERANKER: "false"
      GENERATION_PROVIDER: local
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fire-code-copilot/backend/requirements.txt

      # Cache the downloaded embedding model so we don't re-fetch MiniLM every run.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.LOCAL_EMBEDDING_MODEL }}

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt

      - name: Run test suite
        working-directory: fire-code-copilot/backend
        run: python -m pytest -q

      - name: Run retrieval + citation-safety eval (gate: >=90%, zero fabricated citations)
        working-directory: fire-code-copilot/backend
        run: python -m app.eval

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fire-code-copilot/frontend/package-lock.json

      - name: Install dependencies
        working-directory: fire-code-copilot/frontend
        run: npm ci

      - name: Typecheck
        working-directory: fire-code-copilot/frontend
        run: npm run typecheck

      - name: Build
        working-directory: fire-code-copilot/frontend
        run: npm run build

  containment:
    name: Copyright containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no copyrighted code text is tracked
        run: bash scripts/check_containment.sh
